[package]
name = "keystone-forwarder"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "keystone_forwarder"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
static_assertions = "1.1.0"
bytemuck = { version = "1.0", features = ["derive"] }
arrayvec = { version = "1.0.0", path = "../../crates/arrayvec" }
# Pin blake3 to 1.8.2; 1.8.3+ uses edition2024 (Cargo 1.85+), not available in Anchor build image
blake3 = "1.8.2"
# Pin indexmap to 2.11.x; 2.12+ requires rustc 1.82, Solana tools ship 1.79
indexmap = "2.11"

[lints]
workspace = true

