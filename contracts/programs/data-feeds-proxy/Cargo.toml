[package]
name = "data-feeds-proxy"
version = "0.1.0"
description = "Chainlink Data Feeds proxy: the feed accounts readers integrate with, written by a trusted store"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "data_feeds_proxy"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.0", features = ["event-cpi"] }
static_assertions = "1.1.0"
bytemuck = { version = "1.20.0", features = ["derive", "min_const_generics", "extern_crate_alloc"] }


[lints]
workspace = true
