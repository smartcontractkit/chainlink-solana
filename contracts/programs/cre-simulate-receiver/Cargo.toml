[package]
name = "cre-simulate-receiver"
version = "0.1.0"
description = "Stateless receiver for cre-cli Solana forwarder simulation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cre_simulate_receiver"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.0"

[lints]
workspace = true
