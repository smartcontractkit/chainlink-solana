permissions:
  contents: read
name: Solana Verified Build

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'SHA to build (can be short)'
        required: true
        type: string
  push:
    branches:
      - develop

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      solana_changes: ${{ steps.changes.outputs.solana_changes }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Detect changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          list-files: "shell"
          filters: |
            solana_changes:
              - 'contracts/**'
              - '.github/workflows/solana*.yml'

  build:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.solana_changes == 'true' }}
    runs-on: ubuntu-latest-8cores-32GB
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Get Long and Short SHAs
      id: get_sha
      run: |
        set -euo pipefail
        TARGET_SHA="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sha || github.sha }}"
        FULL_SHA="$(git rev-parse "${TARGET_SHA}")"
        {
          echo "short_sha=${FULL_SHA:0:12}"
          echo "full_sha=${FULL_SHA}"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v6
      with:
        ref: ${{ steps.get_sha.outputs.full_sha }}
        fetch-depth: 0
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
    - name: Install Solana Verify
      run: |
        cargo install solana-verify@0.4.6
    - name: Cache cargo target dir
      id: cache-target
      uses: actions/cache@v5
      with:
        path: /contracts/target/deploy/*.so
        key: ${{ runner.os }}-solana-contract-verified-${{ hashFiles('contracts/**/*.rs', 'contracts/**/Cargo.lock') }}
    - name: Build Verified Artifacts
      if: steps.cache-target.outputs.cache-hit != 'true'
      run: |
        cd contracts
        solana-verify build
    - name: Generate release files
      run: |
        cd contracts
        tar cfvz artifacts.tar.gz target/deploy/*.so 
    - name: Publish Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: solana-artifacts-localtest-${{ steps.get_sha.outputs.short_sha }}
        target_commitish: ${{ steps.get_sha.outputs.full_sha }}
        files: |
          contracts/artifacts.tar.gz
