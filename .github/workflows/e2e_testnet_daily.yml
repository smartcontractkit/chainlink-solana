name: e2e_testnet_daily
on:
  workflow_dispatch:
    inputs:
      cl_branch_ref:
        description: Chainlink repo branch to integrate with
        required: true
        default: develop
        type: string
      test_secrets_override_key:
        description: 'Key to run tests with custom test secrets like ws url, rpc url, private key, etc.'
        required: false
        type: string
      team:
        description: Team to run the tests for (e.g. BIX, CCIP)
        required: true
        type: string
  schedule:
    - cron: '0 6 * * *'
# Only run 1 of this workflow at a time per PR
env:
  CL_ECR: ${{ secrets.QA_AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ secrets.QA_AWS_REGION }}.amazonaws.com/chainlink
  CONTRACT_ARTIFACTS_PATH: contracts/target/deploy
  MOD_CACHE_VERSION: 1

# Only run 1 of this workflow at a time per PR
concurrency:
  group: integration-tests-solana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_test_compilation:
    name: Check integration test compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true
      - run: cd ./integration-tests && go test -run=xxx ./...

  get_projectserum_version:
    name: Get ProjectSerum Version
    environment: integration
    runs-on: ubuntu-latest
    outputs:
      projectserum_version: ${{ steps.psversion.outputs.projectserum_version }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Get ProjectSerum Version
        id: psversion
        uses: ./.github/actions/projectserum_version

  e2e_custom_build_artifacts:
    name: E2E Custom Build Artifacts
    environment: integration
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest-32cores-128GB
    needs: [get_projectserum_version]
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Build contracts
        uses: ./.github/actions/build_contract_artifacts
        with:
          runner-os: ${{ runner.os }}
          image: backpackapp/build
          image-version: ${{ needs.get_projectserum_version.outputs.projectserum_version }}

  e2e_custom_build_custom_chainlink_image:
    name: E2E Custom Build Custom CL Image
    runs-on: ubuntu-latest
    environment: integration
    permissions:
      id-token: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check if image exists
        id: check-image
        uses: smartcontractkit/chainlink-github-actions/docker/image-exists@b49a9d04744b0237908831730f8553f26d73a94b # v2.3.17
        with:
          repository: chainlink
          tag: solana.${{ github.sha }}
          AWS_REGION: ${{ secrets.QA_AWS_REGION }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.QA_AWS_ROLE_TO_ASSUME }}
      - name: Build Image
        if: steps.check-image.outputs.exists == 'false'
        uses: smartcontractkit/chainlink-github-actions/chainlink-testing-framework/build-image@b49a9d04744b0237908831730f8553f26d73a94b # v2.3.17
        with:
          should_checkout: true
          cl_repo: smartcontractkit/chainlink
          cl_ref: ${{ github.event.inputs.cl_branch_ref }}
          dep_solana_sha: ${{ github.event.pull_request.head.sha }}
          push_tag: ${{ env.CL_ECR }}:solana.${{ github.sha }}
          QA_AWS_REGION: ${{ secrets.QA_AWS_REGION }}
          QA_AWS_ROLE_TO_ASSUME: ${{ secrets.QA_AWS_ROLE_TO_ASSUME }}

  e2e_custom_run_smoke_tests:
    name: E2E Smoke Tests (${{ matrix.variant }})
    environment: integration
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest-16cores-64GB
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: embedded
            configs: env.toml,products/solana/basic.toml
          - variant: plugins
            configs: env.toml,products/solana/basic.toml,products/solana/plugins.toml
    needs: [e2e_custom_build_artifacts, e2e_custom_build_custom_chainlink_image, check_test_compilation]
    env:
      CHAINLINK_IMAGE: ${{ env.CL_ECR }}:solana.${{ github.sha }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4.0.1
        with:
          aws-region: ${{ secrets.QA_AWS_REGION }}
          role-to-assume: ${{ secrets.QA_AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 1800
          mask-aws-account-id: true

      - name: Authenticate to ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          registries: ${{ secrets.QA_AWS_ACCOUNT_NUMBER }}
        env:
          AWS_REGION: ${{ secrets.QA_AWS_REGION }}

      - name: Install Solana CLI
        run: ./scripts/install-solana-ci.sh

      - name: Install gauntlet
        uses: ./.github/actions/build-gauntlet

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: integration-tests/go.mod
          cache: true
          cache-dependency-path: integration-tests/go.sum

      - name: Download Go dependencies
        working-directory: integration-tests
        run: go mod download

      - name: Download contract artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: ${{ env.CONTRACT_ARTIFACTS_PATH }}

      - name: Start fakes server
        working-directory: integration-tests/devenv
        run: go run ./fakes/cmd &

      - name: Setup Environment
        working-directory: integration-tests/devenv
        run: go run ./cmd u ${{ matrix.configs }}

      - name: Run Smoke Test
        working-directory: integration-tests/smoke
        run: go test -v -timeout 30m -run TestSolanaOCRV2Smoke

      - name: Show Docker containers status
        if: failure()
        run: docker ps -a

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-${{ matrix.variant }}
          path: |
            integration-tests/devenv/logs/
            integration-tests/smoke/logs/
          retention-days: 1
