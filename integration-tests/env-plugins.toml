[[nodesets]]
name = "sol-ocr"
nodes = 6
override_mode = "all"
http_port_range_start = 20000
p2p_port_range_start = 22000

[nodesets.db]
image = "postgres:15"

[[nodesets.node_specs]]
[nodesets.node_specs.node]
image = "public.ecr.aws/chainlink/chainlink"
[nodesets.node_specs.node.env_vars]
CL_MEDIAN_CMD = "chainlink-feeds"
CL_SOLANA_CMD = "chainlink-solana"